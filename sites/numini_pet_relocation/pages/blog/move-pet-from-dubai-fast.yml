blocks:
  - type: article_header
    category: "Guide · Urgency"
    category_url: "/blog/"
    h1: "Need to move your pet from Dubai fast? Here's what's actually possible"
    standfirst: "It depends on one thing — whether your pet's rabies vaccination is already valid. If it is, a move can take days; if not, the law sets a floor you can't skip."
    author: "the PawRoute relocation team"
    date: "9 June 2026"
    reading_time: 6
    reviewed: "reviewed by our IPATA-certified specialists"
    image: /assets/blog/cost-2026-hero.png
    image_alt: "A pet ready to travel urgently from Dubai"

  - type: prose
    id: answer
    heading: "The honest answer"
    paragraphs:
      - "If your pet is <strong>already microchipped and the rabies vaccination is already valid</strong> (given at least 21 full days ago), the waiting period is behind you — a move can come together in <strong>days</strong>, limited only by the import permit, an airline cargo booking, and the destination's health certificate."
      - "If your pet is <strong>not yet vaccinated</strong>, there's a floor you cannot skip: the UK (and most destinations) require the rabies vaccination at least <strong>21 full days before travel</strong>, and the microchip must come first. That makes <strong>~3 weeks the realistic minimum</strong> for an unvaccinated pet — and routes that need a rabies titre test (Australia, Singapore, non-listed EU) take <strong>months</strong>, not weeks."

  - type: takeaways
    heading: "Key takeaways"
    items:
      - "Already-vaccinated pet (rabies valid ≥21 days) → a move can take <strong>days</strong>."
      - "Not yet vaccinated → <strong>~3-week floor</strong> (microchip → rabies → 21-day wait). You can't backdate it."
      - "Australia / Singapore / non-listed EU → <strong>months</strong> (rabies titre test + waiting period)."
      - "Pets leave Dubai as <strong>IATA-compliant airfreight</strong> (Emirates SkyCargo), with vet support at the Dubai Animal Care area."
      - "Capacity can be tight (heat embargo, disrupted operations) — <strong>book early</strong>, and beware 'emergency pricing'."

