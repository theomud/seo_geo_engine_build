    category: "Route guide · South Africa"
    category_url: "/blog/"
    h1: "Dubai to South Africa: the import permit and the tests that catch people"
    standfirst: "South Africa needs a state veterinary import permit, a rabies titre test and disease testing before your pet can travel — and the permit and titre are what set the timeline."
    author: "the PawRoute relocation team"
    date: "9 June 2026"
    reading_time: 5
    reviewed: "reviewed by our IPATA-certified specialists"
    image: /assets/blog/cost-2026-hero.png
    image_alt: "A pet ready to travel from Dubai to South Africa"

  - type: prose
    id: answer
    heading: "The short answer"
    paragraphs:
      - "To bring a pet into South Africa from Dubai you need a <strong>state veterinary import permit</strong>, a <strong>rabies titre test</strong>, a veterinary health certificate, and (for dogs) <strong>additional disease testing</strong> — plus the usual ISO microchip and rabies vaccination."
      - "It typically costs <strong>AED 14,000–22,000</strong>, and the timeline is driven by the permit and the titre/test results, which take weeks. Confirm the current test list with the South African authority before you start."

  - type: takeaways
    heading: "Key takeaways"
    items:
      - "A <strong>state veterinary import permit</strong> is mandatory and time-limited — apply in the right window."
      - "A <strong>rabies titre test</strong> is required; results take weeks, so book it early."
      - "Dogs face <strong>additional disease tests</strong> — confirm the current list, as it can change."
      - "Core records: <strong>ISO microchip</strong> and valid <strong>rabies vaccination</strong>."
      - "Typical cost Dubai → South Africa: roughly <strong>AED 14,000–22,000</strong>."

  - type: toc
    heading: "In this article"
    items:
