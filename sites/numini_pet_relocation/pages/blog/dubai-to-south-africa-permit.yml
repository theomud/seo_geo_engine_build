  - type: prose
    id: timeline
    eyebrow: "Why it isn't quick"
    heading: "What sets the timeline"
    paragraphs:
      - "Two things drive the South Africa timeline: the <strong>import permit</strong>, which is time-limited and must align with your travel window, and the <strong>titre test plus any disease tests</strong>, whose lab results take weeks."
      - "Because the permit is dated, the sequence has to be planned backwards from the flight — apply too early and it can lapse; too late and you can't travel. Confirm the exact, current test requirements with the official source first."

  - type: story
    id: story
    heading: "What going wrong actually looks like"
    tag: "A common scenario"
    lead: "On the South Africa route, the trap is mistiming the permit and the lab work."
    problem: "An owner relocating home wants their dog in South Africa within a few weeks."
    mistake: "They book the rabies titre and disease tests late and apply for the permit out of sync with the flight."
    discovery: "The lab results take weeks and the permit is time-limited — the dates don't line up."
    result: "Travel slips while the tests clear and a fresh permit is issued, with boarding in the meantime."
    lesson: "South Africa rewards sequencing: confirm the test list, book the labs early, and time the permit to the flight — not the other way round."

  - type: faq
    id: faq
    heading: "Frequently asked questions"
    items:
      - { q: "Do I need a rabies titre test for South Africa?", a: "Yes — a rabies titre test is part of the requirements, and results take weeks, so book it early. Confirm the full current test list with the South African authority." }
      - { q: "What's the pivotal document?", a: "The state veterinary import permit. It's time-limited, so it must be timed to your flight — apply too early and it can lapse." }
      - { q: "Will my pet be quarantined in South Africa?", a: "With the permit, titre and tests in order, the focus is documentation and testing rather than a long quarantine — but confirm current requirements, as they can change." }
      - { q: "How much does Dubai → South Africa cost?", a: "Typically AED 14,000–22,000, depending on your pet's size, the tests required and the airline." }

