  - type: article_header
    category: "Route guide · USA"
    category_url: "/blog/"
    h1: "Dubai to the USA: the CDC dog rules that trip people up"
    standfirst: "The US now requires every dog to have a CDC Dog Import Form and be at least 6 months old — and that pair is what catches people out moving from Dubai."
    author: "the PawRoute relocation team"
    date: "9 June 2026"
    reading_time: 6
    reviewed: "reviewed by our IPATA-certified specialists"
    image: /assets/blog/cost-2026-hero.png
    image_alt: "A dog ready to travel from Dubai to the USA"

  - type: prose
    id: answer
    heading: "The short answer"
    paragraphs:
      - "To bring a dog into the USA from Dubai, the CDC requires that every dog has a <strong>CDC Dog Import Form receipt</strong>, is <strong>at least 6 months old</strong>, is <strong>microchipped</strong> (readable by a universal scanner), and appears healthy on arrival."
      - "The UAE is treated as a dog-rabies low-risk origin, so a US rabies certificate isn't the hurdle — the <strong>CDC form and the 6-month age rule</strong> are what catch people out. Plan around them and the move is straightforward."

  - type: takeaways
    heading: "Key takeaways"
    items:
      - "Every dog needs a <strong>CDC Dog Import Form</strong> receipt — fill it out online before travel."
      - "The dog must be <strong>at least 6 months old</strong> on arrival."
      - "A <strong>microchip</strong> readable by a universal scanner is mandatory and must be recorded before the form."
      - "The dog must <strong>appear healthy</strong> at entry."
      - "Typical cost Dubai → USA: roughly <strong>AED 13,800–22,000</strong>, about 4–12 weeks."

