  - type: prose
    id: cdc
    eyebrow: "The 2026 rules"
    heading: "What the CDC requires"
    paragraphs:
      - "Since the CDC's updated dog-import rules, <strong>all dogs entering the USA</strong> must travel with a CDC Dog Import Form receipt, be at least six months old, be microchipped, and look healthy at the port of entry. Dogs from low-risk countries like the UAE don't need extra rabies documentation, but they still must meet every one of those baseline conditions."
      - "There's no shortcut on the age rule: a puppy under six months simply cannot enter, however complete the rest of the paperwork is."

  - type: prose
    id: order
    eyebrow: "Sequence matters"
    heading: "The order that keeps you compliant"
    bullets:
      - "<strong>Microchip first</strong> — it's the identity that ties every later document together."
      - "<strong>Confirm the dog will be 6 months old</strong> on the travel date before booking anything."
      - "<strong>Submit the CDC Dog Import Form</strong> in the window the CDC specifies before arrival and keep the receipt."
      - "<strong>UAE export side</strong> — MOCCAE export permit and a fit-to-fly health certificate."

  - type: story
    id: story
    heading: "What going wrong actually looks like"
    tag: "A common scenario"
    lead: "On the USA route, the trap usually isn't rabies — it's age and the form."
    problem: "A family wants to fly their 5-month-old puppy to the US with them next month."
    mistake: "They assume healthy-and-vaccinated is enough and don't check the age rule or the CDC form."
    discovery: "The puppy is under six months, so it can't enter — and no one submitted the CDC Dog Import Form."
    result: "The puppy stays in boarding until it's old enough, then flies separately — extra cost and a hard goodbye at the airport."
    lesson: "For the USA, check two things first: the dog's age on arrival and the CDC form. Everything else is routine."

  - type: faq
    id: faq
    heading: "Frequently asked questions"
    items:
      - { q: "Do I need a CDC Dog Import Form for a dog from Dubai?", a: "Yes. Every dog entering the USA must travel with a CDC Dog Import Form receipt, regardless of origin." }
      - { q: "How old must my dog be?", a: "At least six months on the date of arrival. This applies to all dogs entering the USA." }
      - { q: "Does my dog need a rabies titre test for the USA?", a: "No. The UAE is treated as a dog-rabies low-risk origin, so the focus is the CDC form, the age rule, microchip and overall health — not a titre test." }
