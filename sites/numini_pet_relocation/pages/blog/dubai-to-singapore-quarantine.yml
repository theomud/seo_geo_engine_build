  - type: flow
    id: process
    heading: "The process, step by step"
    body: "Singapore is licence-led — the permit and quarantine slot anchor everything."
    steps:
      - "ISO microchip + rabies vaccination"
      - "Rabies titre test (results take weeks)"
      - "Apply for the AVS import licence"
      - "Book the quarantine slot + flight"
      - "Arrival, quarantine stay, then home"

  - type: prose
    id: timeline
    eyebrow: "Why it isn't quick"
    heading: "Why the timeline runs long"
    paragraphs:
      - "Two things stretch the Singapore timeline: the <strong>titre test</strong>, whose lab results take weeks, and the <strong>quarantine slot</strong>, which must be reserved in advance and can be limited. Neither can be rushed at the last minute."
      - "Because the licence is time-limited and tied to your travel window, the sequence has to be planned backwards from the flight — get that wrong and the licence can lapse before you fly."

  - type: story
    id: story
    heading: "What going wrong actually looks like"
    tag: "A common scenario"
    lead: "On the Singapore route, the usual trap is leaving the titre test and quarantine slot too late."
    problem: "An owner relocating for work wants their cat in Singapore within a month."
    mistake: "They start the rabies titre test late and assume quarantine can be sorted on arrival."
    discovery: "The titre results take weeks and quarantine slots must be pre-booked — the timeline doesn't fit."
    result: "The cat travels later than planned, with extra boarding in Dubai while the licence and slot line up."
    lesson: "Singapore rewards early planning. Book the titre test and quarantine slot first; the flight comes last."

  - type: faq
    id: faq
    heading: "Frequently asked questions"
    items:
      - { q: "Does my pet need a rabies titre test for Singapore?", a: "Yes — a rabies titre test is part of Singapore's requirements for pets from the UAE's risk category, and the lab results take weeks, so book it early." }
      - { q: "Will my pet be quarantined in Singapore?", a: "Expect a quarantine stay on arrival for pets in the UAE's category. The slot must be booked in advance, so plan it before the flight." }
      - { q: "How much does Dubai → Singapore cost?", a: "Typically AED 18,000–28,000, depending on your pet's size, the airline and quarantine fees." }
      - { q: "What's the first thing I should do?", a: "Microchip and vaccinate, then book the rabies titre test — its result timing sets the whole schedule." }

