  - type: prose
    id: answer
    heading: "The short answer"
    paragraphs:
      - "To bring a pet into Canada from Dubai you need to meet the <strong>CFIA import requirements</strong> — for dogs, the central one is a <strong>valid rabies vaccination certificate</strong> with the right detail, plus the standard UAE export documents. There is <strong>no quarantine</strong>."
      - "Canada's process is lighter than Australia's, but it's exacting: a rabies certificate missing a detail (dates, microchip number, vet signature) can hold your pet at inspection. Confirm the current CFIA requirements for your pet type before you travel."

  - type: takeaways
    heading: "Key takeaways"
    items:
      - "Meet the <strong>CFIA import requirements</strong>; for dogs the key document is a <strong>valid rabies vaccination certificate</strong>."
      - "<strong>No quarantine</strong> — the risk is an inexact certificate, not a holding period."
      - "An <strong>ISO microchip</strong> ties the records together; record it before the vaccination certificate."
      - "Requirements differ for <strong>cats vs dogs</strong> and personal vs commercial import — confirm your category."
      - "Typical cost Dubai → Canada: roughly <strong>AED 14,000–20,000</strong>, about 4–6 weeks."

