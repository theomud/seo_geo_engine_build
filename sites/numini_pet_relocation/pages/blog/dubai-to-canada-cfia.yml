    h1: "Dubai to Canada: no quarantine, but the rabies certificate must be exact"
    standfirst: "Canada needs a valid rabies vaccination certificate and a CFIA import check — there's no quarantine, but an inexact certificate is what causes problems at the border."
    author: "the PawRoute relocation team"
    date: "9 June 2026"
    reading_time: 5
