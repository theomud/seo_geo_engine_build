  - type: prose
    id: cfia
    eyebrow: "The Canadian requirements"
    heading: "What CFIA requires"
    paragraphs:
      - "The Canadian Food Inspection Agency (CFIA) sets the import requirements, and an inspection happens on arrival. For dogs from the UAE, the central requirement is a valid rabies vaccination certificate that matches your pet's microchip and shows the right dates and vet details."
      - "Because requirements vary by pet type and by whether the move is personal or commercial, confirm your exact category with CFIA before booking — that one check prevents almost every Canada-route problem."

  - type: story
    id: story
    heading: "What going wrong actually looks like"
    tag: "A common scenario"
    lead: "On the Canada route, problems are almost never quarantine — they're a certificate detail."
    problem: "An owner has their dog fully vaccinated and books the flight to Canada."
    mistake: "The rabies certificate lists a vaccination date that doesn't line up, and the microchip number isn't on it."
    discovery: "At the CFIA inspection the mismatch is flagged, and the dog is held while it's sorted."
    result: "Hours of stress at arrival and a re-issued certificate — avoidable with one document check beforehand."
    lesson: "Canada doesn't quarantine — but it does check carefully. Get the rabies certificate exact and matched to the microchip, and arrival is simple."

  - type: faq
    id: faq
    heading: "Frequently asked questions"
    items:
      - { q: "Will my pet be quarantined in Canada?", a: "No. Canada doesn't quarantine pets that meet CFIA import requirements; there's an inspection on arrival instead." }
      - { q: "Do I need a rabies titre test for Canada?", a: "For personal pets from the UAE the central requirement is a valid rabies vaccination certificate rather than a titre test — but confirm your exact category with CFIA, as rules differ for cats, dogs and commercial imports." }
      - { q: "What's the most common Canada-route mistake?", a: "An inexact rabies certificate — wrong dates, or a missing microchip number — flagged at the CFIA inspection. A document check beforehand prevents it." }
      - { q: "How much does Dubai → Canada cost?", a: "Typically AED 14,000–20,000 depending on your pet's size and the airline, over about 4–6 weeks." }

