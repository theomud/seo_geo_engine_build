title: "Breed Restrictions: Which Pets Can Fly From Dubai?"
title_suffix: ""
meta_description: "Two breed issues when flying a pet from Dubai: banned breeds that can't enter (UK XL Bully, Pit Bull) and snub-nosed breeds that face airline + summer heat limits. Here's the detail."
og_title: "Banned breeds & snub-nosed pets: what can fly from Dubai?"
updated: "2026-06-09"
layout: article

blocks:
  - type: article_header
    category: "Guide · Breeds"
    category_url: "/blog/"
    h1: "Which breeds can fly from Dubai — and which can't"
    standfirst: "There are two separate breed issues: some breeds are banned from entering certain countries, and snub-nosed breeds face airline and summer heat restrictions. Know which applies to your pet before you plan."
    author: "the PawRoute relocation team"
    date: "9 June 2026"
    reading_time: 5
    reviewed: "reviewed by our IPATA-certified specialists"
    image: /assets/blog/cost-2026-hero.png
    image_alt: "Different dog breeds and the rules for flying them from Dubai"

  - type: prose
    id: answer
    heading: "The short answer"
    paragraphs:
      - "<strong>Banned breeds can't enter some countries at all.</strong> The UK bans the Pit Bull Terrier, XL Bully (since 1 February 2024), Japanese Tosa, Dogo Argentino and Fila Brasileiro under the Dangerous Dogs Act — no import, whatever the paperwork."
      - "<strong>Snub-nosed (brachycephalic) breeds can usually travel, but with limits.</strong> Bulldogs, Pugs, Boxers, Persians and similar flat-faced breeds face airline restrictions and the UAE summer heat embargo, because they're more prone to breathing and heat stress. It's about <em>how</em> and <em>when</em> they fly, not whether they can."

  - type: takeaways
    heading: "Key takeaways"
    items:
      - "<strong>Banned (UK):</strong> Pit Bull, XL Bully, Japanese Tosa, Dogo Argentino, Fila Brasileiro — cannot enter."
      - "Breed bans are <strong>destination-specific</strong> — always verify your exact destination."
      - "<strong>Snub-nosed breeds</strong> face airline limits + the UAE summer heat embargo (≈May–Sep)."
      - "Snub-nosed pets often need a <strong>larger crate</strong> for airflow and careful airline/route choice."
      - "We verify breed eligibility <strong>before</strong> anything else — no surprises at booking."

