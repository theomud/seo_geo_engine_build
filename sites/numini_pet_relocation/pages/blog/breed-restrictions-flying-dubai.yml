  - type: prose
    id: snub
    eyebrow: "Why flat-faced breeds need extra care"
    heading: "Snub-nosed breeds & the heat embargo"
    paragraphs:
      - "Brachycephalic (snub-nosed) breeds have shortened airways, which makes them more vulnerable to heat and breathing stress in transit. Airlines apply extra restrictions for them, and during the UAE summer heat embargo (roughly May to September) pet cargo is restricted or refused when ground temperatures are unsafe."
      - "It rarely means your pet can't go — it means timing, airline choice and a correctly-sized crate matter even more. Emirates SkyCargo, for example, publishes specific snub-nosed uplift guidance. We plan these moves around cooler windows and suitable carriers."

  - type: story
    id: story
    heading: "What going wrong actually looks like"
    tag: "A common scenario"
    lead: "With breeds, the trap is assuming 'allowed' means 'any flight, any time'."
    problem: "An owner books a July flight for their French Bulldog, a snub-nosed breed."
    mistake: "They pick the cheapest airline without checking its snub-nosed and summer-heat rules."
    discovery: "In peak summer, the carrier won't accept the breed — the heat embargo and brachycephalic limits both apply."
    result: "The move shifts to a cooler month on a suitable airline, with a larger crate for airflow."
    lesson: "For snub-nosed breeds, the breed isn't the blocker — timing and airline choice are. Plan around the heat from the start."

  - type: faq
    id: faq
    heading: "Frequently asked questions"
    items:
      - { q: "Can my XL Bully or Pit Bull go to the UK?", a: "No. The XL Bully (banned since 1 February 2024), Pit Bull Terrier, Japanese Tosa, Dogo Argentino and Fila Brasileiro are prohibited from entering the UK under the Dangerous Dogs Act — regardless of paperwork. Other destinations have their own lists." }
      - { q: "Can Pugs, Bulldogs or Persian cats fly?", a: "Usually yes, but as snub-nosed breeds they face airline restrictions and the UAE summer heat embargo. Route, timing and crate size are critical, and some airlines limit them in hot months." }
      - { q: "Are breed rules the same for every country?", a: "No — breed bans are destination-specific. A breed allowed in one country may be banned in another, so we verify against your exact destination before booking." }
      - { q: "Will summer affect my snub-nosed dog's travel?", a: "It can. From about May to September the heat embargo restricts pet cargo when it's too hot; snub-nosed breeds are affected first. We plan around cooler windows." }

