    body: "The honest trade-off — money saved against risk carried."
    us_label: "With a company"
    them_label: "Doing it yourself"
    rows:
      - { feature: "Cost", us: "Higher (service fee)", them: "Lower (no fee)" }
      - { feature: "Your time & admin", us_yes: true, us: "Minimal — they handle it", them: "Significant — you coordinate everything" }
