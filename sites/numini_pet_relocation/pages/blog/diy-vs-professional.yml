  - type: prose
    id: when
    eyebrow: "Be honest with yourself"
    heading: "When DIY makes sense — and when it doesn't"
    bullets:
      - "<strong>DIY can work if:</strong> the route has no quarantine, your pet is already microchipped and rabies-valid, you have weeks of buffer, and you're comfortable reading official requirements carefully."
      - "<strong>Hire a professional if:</strong> the route needs a titre test or quarantine (Australia, Singapore), your timeline is tight, you're travelling in the summer heat embargo, your breed is restricted, or you simply can't afford a mistake."
      - "<strong>Either way, the regulations are the same.</strong> The choice isn't about easier rules — it's about who carries the work and the risk."

  - type: story
    id: story
    heading: "What going wrong actually looks like"
    tag: "A common scenario"
    lead: "Most DIY moves are fine. The ones that aren't usually fail on a single detail."
    problem: "An owner does a Dubai → UK move themselves to save the fee — sensible on paper."
    mistake: "They use a vet who isn't APHA-approved and time the tapeworm treatment a day too early."
    discovery: "At check-in the certificate is rejected and the tapeworm window has lapsed."
    result: "A rebooked flight, a fresh certificate and boarding wipe out the saving — and then some."
    lesson: "DIY isn't wrong; an un-checked detail is. If you go it alone, treat the APHA vet and the timing windows as non-negotiable."

  - type: faq
    id: faq
    heading: "Frequently asked questions"
    items:
      - { q: "Can I really move my pet from Dubai myself?", a: "Yes. Owners do it, especially on simple no-quarantine routes with an already-vaccinated pet and enough time. The rules are public — the work and the risk are yours to manage." }
      - { q: "Is DIY cheaper?", a: "Usually, because you're not paying a service fee. Just weigh that saving against the cost of a rejected entry if a document or timing window is wrong — that can cost more than the fee." }
      - { q: "Can a company make it faster or skip steps?", a: "No. The rabies waiting period, titre tests and permits are legal requirements — identical for everyone. A company manages and de-risks the process; it doesn't get shortcuts." }
      - { q: "When is hiring a company clearly worth it?", a: "Hard routes (Australia, Singapore), tight deadlines, summer travel, restricted breeds, or when you simply can't risk a mistake with your pet's entry." }

