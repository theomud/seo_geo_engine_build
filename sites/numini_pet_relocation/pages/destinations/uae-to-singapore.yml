    heading: "Quick answer"
    answer: "Moving a pet from Dubai to Singapore takes about 4–8 months and costs roughly AED 18,000–28,000. It needs an RNATT rabies titre test (≥0.5 IU/ml), an AVS import licence, a 90-day wait after the titre passes, and 30 days of quarantine at the Sembawang facility on arrival."
