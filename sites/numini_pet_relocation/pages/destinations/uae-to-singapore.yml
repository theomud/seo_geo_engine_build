    eyebrow: "What it takes"
    heading: "The Singapore requirements"
    body: "The headline steps below come from Singapore's Animal & Veterinary Service (AVS). We confirm the current detail for your pet and dates before you commit."
    items:
      - { title: "ISO microchip first", text: "15-digit chip, implanted before vaccination." }
      - { title: "RNATT titer test", text: "Rabies Neutralising Antibody Titre Test — must read at least 0.5 IU/ml." }
      - { title: "90-day wait", text: "After the titer passes — less strict than Australia's 180 days, but still months." }
      - { title: "AVS import licence", text: "Required from Singapore's Animal & Veterinary Service before travel." }
      - { title: "30-day quarantine", text: "On arrival, at the Sembawang quarantine facility." }

