  - type: faq
    heading: "Dubai → Singapore: your questions"
    items:
      - { q: "What's the RNATT test?", a: "The Rabies Neutralising Antibody Titre Test. Your pet's result must be at least 0.5 IU/ml, and it sets off a 90-day waiting period before travel." }
      - { q: "How long is quarantine?", a: "30 days at the Sembawang facility. It's a government requirement." }
      - { q: "Is Singapore as hard as Australia?", a: "Close. The 90-day wait is shorter than Australia's 180 days, but the licence, titer test and quarantine make it one of the strictest routes." }
      - { q: "Can you guarantee the arrival date?", a: "No. Airline and quarantine slots change. We give you a realistic timeline and keep you informed, but we never guarantee a delivery date." }

