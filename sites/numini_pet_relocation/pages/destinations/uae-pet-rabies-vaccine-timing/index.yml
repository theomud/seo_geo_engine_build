  - type: key_facts
    id: rule
    heading: "The accurate timing rule"
    answer: "For bringing a pet into the UAE, the rabies vaccine must be given at least 21 days before travel when it is a first or lapsed (expired) vaccination — not the 30 days many websites repeat. Crucially, there is no waiting period at all if your pet already has a valid booster (a vaccination given while the previous one was still in date). The microchip must be implanted before the rabies vaccine, or the vaccination may not be accepted. With this in order, compliant pets are not quarantined in the UAE."
    stats:
      - { label: "First / lapsed dose", value: "≥ 21 days" }
      - { label: "Valid booster", value: "0-day wait" }
      - { label: "Microchip", value: "Before the vaccine" }
      - { label: "Source", value: "MOCCAE" }
    verified: "June 2026"
    source_authority: "UAE MOCCAE"

  - type: callout
    style: warn
    heading: "Myth vs fact: 'vaccinate 30 days before'"
    body: >
      The UAE rule is at least 21 days before travel for a first or lapsed rabies dose —
      and zero days for a valid booster. The 30-day figure is widely repeated but isn't the
      permit rule; it often gets confused with the separate rabies titre-test timing (which
      involves a wait after vaccination for high-risk origins only). If your pet's booster is
      already current, you do not have to re-vaccinate and wait — a detail that can save you
      weeks.

  - type: prose
    id: detail
    eyebrow: "The part that saves time"
    heading: "First dose vs valid booster"
    paragraphs:
      - "The 21-day waiting period exists so a <em>new</em> rabies vaccination has time to take effect. It applies to a <strong>first vaccination</strong> or one that was allowed to <strong>lapse</strong> (expire). If your pet's vaccination is already valid and you give the next booster <strong>before the current one expires</strong>, there is <strong>no waiting period</strong> — the protection is treated as continuous."
      - "This is the detail most owners (and most websites) miss. Assuming you always need a fresh 21-or-30-day wait can push a move back by weeks for no reason. The sequence also matters: the <strong>microchip must be implanted before the rabies vaccine</strong>, or the vaccination record may not be accepted."

  - type: checklist
    eyebrow: "Get it right"
    heading: "The rabies timing checklist (MOCCAE-verified)"
    body: "Confirmed against MOCCAE, June 2026."
    items:
      - { title: "Microchip first", text: "ISO microchip implanted before the rabies vaccine — order matters." }
      - { title: "First / lapsed dose: ≥ 21 days", text: "A new or expired-then-renewed vaccination must be given at least 21 days before travel." }
      - { title: "Valid booster: no wait", text: "A booster given while the previous vaccination is still valid has no waiting period." }
      - { title: "Keep continuity", text: "Don't let the vaccination lapse — an unbroken record is what removes the wait." }

  - type: faq
    id: faq
    heading: "UAE rabies vaccine timing: your questions"
    items:
      - { q: "Is it 21 days or 30 days before travel for the UAE?", a: "At least 21 days before travel for a first or lapsed rabies dose, confirmed against MOCCAE. The 30-day figure is incorrect for the vaccine — it's usually confused with the rabies titre-test timing, which only applies to high-risk origins." }
      - { q: "Do I need to wait 21 days if my dog's booster is already valid?", a: "No. If you give the booster before the previous vaccination expires, there is no waiting period — protection is treated as continuous. The 21-day wait only applies to a first or lapsed dose." }
      - { q: "Does the microchip have to come before the rabies vaccine?", a: "Yes. The ISO microchip must be implanted before the rabies vaccine, or the vaccination record may not be accepted. It's the most common sequencing mistake." }
      - { q: "Will my pet be quarantined in the UAE?", a: "No — with a valid import permit, microchip and correctly-timed rabies vaccination (plus a titre if your origin is high-risk), compliant pets are not quarantined on arrival." }

