      - { title: "MOCCAE application & airport inspection", text: "Weeks 3–4. The export side of the paperwork." }
      - { title: "Export health certificate", text: "Week 4, from the APHA-approved vet. Valid 30 days." }
      - { title: "Book cargo space", text: "Weeks 4–5. Emirates, British Airways, Qatar Airways or Virgin Atlantic — cargo fills 30–60 days ahead, so book early." }
      - { title: "Tapeworm treatment for dogs", text: "1–5 days before arrival. We schedule it precisely against your flight." }
      - { title: "Fly & clear UK customs", text: "Departure day handover, then UK customs (usually 30–60 mins) and on to you." }

