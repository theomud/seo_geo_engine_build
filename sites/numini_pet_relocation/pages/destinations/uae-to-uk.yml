  - type: callout
    style: warn
    heading: "The #1 mistake on the UK route"
    body: >
      Dogs need a tapeworm treatment 1–5 days before arrival in the UK — not
      earlier, not later. Too early and it's invalid; too late and your dog is
      refused entry or quarantined. Cats don't need it. We schedule this around
      your flight so the window is never missed.

  - type: checklist
    eyebrow: "What you'll need"
    heading: "Requirements for the UK"
    body: "Two sides to satisfy: the UAE export rules (MOCCAE) and the UK import rules (APHA). We handle both."
    items:
      - { title: "ISO microchip", text: "11784/11785, 15-digit — implanted before the rabies vaccine, or the vaccine is invalid." }
      - { title: "Rabies vaccine", text: "At least 21 days before departure, with batch numbers on the certificate." }
      - { title: "APHA-approved vet", text: "The UK health certificate must come from a vet on APHA's approved list. Most Dubai vets aren't — DKC and British Vet Hospital are. We verify before booking." }
      - { title: "Export health certificate", text: "Issued by a government vet, valid 30 days — and it must still be valid at arrival, not just departure." }
      - { title: "MOCCAE export clearance", text: "Online application plus an airport cargo-terminal inspection." }
      - { title: "Tapeworm treatment (dogs only)", text: "1–5 days before UK arrival. Cats are exempt." }

