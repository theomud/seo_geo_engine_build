  - type: key_facts
    heading: "Quick answer"
    answer: "Moving a pet from Dubai to the UK takes about 4–8 weeks and costs roughly AED 12,000–18,000 for a dog (AED 8,000–14,000 for a cat). There is no quarantine when the paperwork is correct — but dogs must have a tapeworm treatment 1–5 days before arrival, and the health certificate must come from an APHA-approved vet."
