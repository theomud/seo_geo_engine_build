  - type: faq
    heading: "Dubai → UK: your questions"
    items:
      - { q: "Do I need a UK import permit?", a: "No. The UK doesn't issue pre-import permits for pets. You just need the APHA health certificate." }
      - { q: "Why can't I use my local Dubai vet?", a: "APHA keeps a whitelist of approved third-country vets, and most Dubai vets aren't on it. DKC is; British Vet Hospital is. We verify approval before any appointment." }
      - { q: "What if I miss the tapeworm treatment timing?", a: "Entry is blocked and your dog is quarantined or returned. It's the most common UK-route mistake, which is why we schedule it precisely against your flight." }
      - { q: "Does my cat need the tapeworm treatment?", a: "No. Cats are exempt for the UK. Only dogs need it." }
      - { q: "What if the health certificate expires during transport?", a: "It must be valid at arrival, not just departure. The certificate lasts 30 days from issue, so we coordinate the issue date with your cargo booking." }
      - { q: "Can my Pit Bull go to the UK?", a: "No. Pit Bull Terrier, Japanese Tosa, Dogo Argentino and Fila Brasileiro are banned under the Dangerous Dogs Act 1991 — and since 1 February 2024 the XL Bully is banned too (it can't be brought into the UK). Dogs are judged on physical type, not pedigree, so bully-type dogs can face extra scrutiny at entry. We confirm your breed before booking." }
      - { q: "Will my pet be okay in cargo for 8+ hours?", a: "A healthy pet travels safely in modern pressurised, temperature-controlled cargo holds. For pets over 10 years old we recommend a fit-to-fly check first. We never give medical advice — that's between you and your vet." }
      - { q: "Do I need pet insurance?", a: "It's not required, but recommended. Airline liability is limited (around AED 1,000)." }
      - { q: "What's the arrival process in the UK?", a: "Your pet clears customs, usually within 30–60 minutes, then comes to you or a pet hotel. No quarantine when the paperwork is correct." }
      - { q: "How much is UK customs clearance?", a: "Usually AED 500–1,000 with correct documents. It can exceed AED 5,000 if paperwork is wrong, because of delays and re-inspections." }

