  - type: faq
    heading: "Dubai → India: your questions"
    items:
      - { q: "Is there quarantine for India?", a: "Usually not for pets brought with correct documentation — especially returning residents transferring residence. But a 15-day quarantine can apply in some cases, so we confirm your specific situation before booking." }
      - { q: "What's the AQCS NOC and DGFT licence?", a: "The AQCS NOC is a clearance from India's Animal Quarantine and Certification Services, required before your pet lands. Most pets also need a DGFT import licence, which can take about a month — so we start both early." }
      - { q: "Why is India cheaper than most routes?", a: "It's a short flight from the UAE with frequent cargo capacity, which keeps freight costs down." }
      - { q: "Can you guarantee the arrival date?", a: "No. Airlines change schedules. We give you a realistic timeline and keep you updated, but never guarantee a delivery date." }

