  - type: key_facts
    heading: "Quick answer"
    answer: "Moving a pet from Dubai to India takes about 3–5 weeks and costs roughly AED 8,000–14,000 — one of the cheapest routes. India requires an AQCS No-Objection Certificate (NOC) and, for most pets, a DGFT import licence (allow about a month). Pets brought with correct documentation by returning residents usually avoid quarantine, but a 15-day quarantine can apply in some cases, so we confirm your situation first."
    stats:
      - { label: "Timeline", value: "3–5 weeks*" }
      - { label: "Cost", value: "AED 8,000–14,000" }
      - { label: "Quarantine", value: "Usually none*" }
      - { label: "Clearance", value: "AQCS NOC + DGFT" }
    verified: "June 2026"
    source_authority: "India AQCS / DGFT"

  - type: checklist
    eyebrow: "What you'll need"
    heading: "Requirements for India"
    body: "India's entry is handled through the Animal Quarantine and Certification Services (AQCS). We confirm the current detail before booking."
    items:
      - { title: "ISO microchip first", text: "15-digit chip, implanted before the rabies vaccine." }
      - { title: "Current rabies vaccination", text: "Documented and current, with batch numbers on the certificate." }
      - { title: "AQCS NOC", text: "No-Objection Certificate / clearance from Animal Quarantine and Certification Services, required before landing." }
      - { title: "DGFT import licence", text: "Most pets need a licence from the Directorate General of Foreign Trade — allow about a month to process." }
      - { title: "Health certificate", text: "From an approved vet." }
      - { title: "MOCCAE export + IATA crate", text: "UAE export process and a crate sized to your pet." }

  - type: steps
    eyebrow: "The right order"
    heading: "How the Dubai → India move works"
    items:
      - { title: "Confirm city & date", text: "We confirm AQCS requirements for your entry city." }
      - { title: "Microchip, then rabies vaccine", text: "Chip first — order matters." }
      - { title: "AQCS NOC + health certificate", text: "Arrange the clearance and the export health certificate." }
      - { title: "MOCCAE export + book flight", text: "UAE export paperwork, IATA crate and cargo space." }
      - { title: "Fly & clear customs", text: "Your pet clears AQCS and comes to you. No quarantine." }

