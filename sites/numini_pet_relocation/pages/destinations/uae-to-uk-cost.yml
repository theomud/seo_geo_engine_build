  - type: callout
    style: warn
    heading: "The timing trap that costs people their pet's entry"
    body: >
      For dogs, the UK requires a tapeworm treatment 1–5 days before arrival — not earlier, not
      later. Too early and it's invalid; too late and your dog is refused entry or held. Cats don't
      need it. It's the most common reason a Dubai → UK move goes wrong, and it's free to get right.

