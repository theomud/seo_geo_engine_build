  - type: key_facts
    heading: "Quick answer"
    answer: >
      Relocating a pet from Dubai to the UK costs roughly AED 12,000–18,000 for a dog and
      AED 8,000–14,000 for a cat, takes about 4–8 weeks, and involves no quarantine — provided
      the paperwork is correct and (for dogs) the tapeworm treatment is given 1–5 days before arrival.
