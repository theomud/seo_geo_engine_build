  - type: story
    id: story
    heading: "Where the money usually leaks"
    tag: "A common scenario"
    lead: "The biggest cost on a Dubai → UK move is almost never the airline — it's one mistimed detail."
    problem: "An owner takes the cheapest quote for their Labrador, flying in three weeks."
    mistake: "The provider uses a vet who isn't APHA-approved and gives the tapeworm treatment a week early to 'be safe'."
    discovery: "At check-in the UK health certificate is rejected and the 24–120 hour tapeworm window has lapsed — the dog can't board."
    result: "A rebooked flight, a fresh certificate and a few days of boarding add roughly AED 6,000 and over a week."
    lesson: "The cheapest quote cost the most. An APHA-approved vet and the tapeworm window aren't details — they decide whether your dog flies."

  - type: faq
    heading: "Dubai → UK cost: your questions"
    items:
      - { q: "How much does it cost to move a dog from Dubai to the UK?", a: "Roughly AED 12,000–18,000 all-in for a standard route, depending on your dog's size (which sets the air-freight cost) and the airline. The full line-by-line breakdown is above — no hidden fees." }
      - { q: "Is it cheaper for a cat?", a: "Usually — about AED 8,000–14,000, because cats travel in smaller crates and (unlike dogs) don't need the UK tapeworm treatment." }
      - { q: "Will my pet go into quarantine in the UK?", a: "No — the UK doesn't quarantine pets that arrive with correct paperwork. The risk isn't quarantine; it's a documentation error, which is exactly what we prevent." }
      - { q: "Why can't I use my normal Dubai vet?", a: "The UK health certificate must come from an APHA-approved third-country vet. Most Dubai vets aren't on that list — DKC and British Vet Hospital are. We confirm approval before any appointment." }
      - { q: "Can my XL Bully or Pit Bull come to the UK?", a: "No. Pit Bull, XL Bully (banned since 1 February 2024), Japanese Tosa, Dogo Argentino and Fila Brasileiro are banned under the Dangerous Dogs Act. We verify your breed before booking." }
      - { q: "Can you guarantee the arrival date?", a: "No — and be wary of anyone who does. Airlines change cargo schedules, especially in the UAE summer heat. We give a realistic timeline and keep you updated, but never promise an exact arrival." }

