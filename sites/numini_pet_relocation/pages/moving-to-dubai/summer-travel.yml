blocks:
  - type: hero
    eyebrow: "Moving to/from Dubai · timing"
    heading: "Can I fly my pet in the Dubai summer?"
    subheading: >
      If you're worried about flying your pet in the Dubai heat, that fear is well-founded —
      and it's the catch that surprises people most. From roughly May to September, airlines
      restrict or refuse pet cargo when it's too hot, for your pet's safety. It doesn't make a
      move impossible; it means you plan around it. Here's exactly how.
    ctas:
      - { label: "How to plan around it", url: "#plan", style: "btn-gold" }
      - { label: "Ask about your dates", url: "#quote", style: "btn-ghost" }

  - type: key_facts
    heading: "Quick answer"
    answer: >
      Many airlines restrict or ban pet cargo when ground temperatures exceed about
      30°C, which in the UAE means high risk from roughly May to September — peaking
      June to August. A summer move isn't impossible, but it can be delayed by weeks,
      so timing and airline choice matter. We never put a pet on a flight that isn't
      safe for the conditions.
    stats:
      - { label: "High-risk months", value: "May–September" }
      - { label: "Typical trigger", value: "Ground temp > 30°C" }
      - { label: "Impact", value: "Delays, limited flights" }
      - { label: "Delivery dates", value: "Never guaranteed" }
    verified: "June 2026"
    source_authority: "Airline + IATA policy"

  - type: steps
    id: plan
    eyebrow: "Move safely in summer"
    heading: "How to plan around the heat embargo"
    items:
      - { title: "Start early and stay flexible on dates", text: "Build slack into your timeline so a heat delay doesn't derail your move." }
      - { title: "Choose airlines and routes that handle summer pets", text: "Some carriers and routings have temperature-controlled handling and cooler transit hubs. We match you to one." }
      - { title: "Fly at the coolest possible times", text: "Night and early-morning departures reduce the heat risk on the ground." }
      - { title: "Get an honest go / no-go call", text: "If conditions aren't safe, we say so. Your pet only flies when it's safe — no exceptions." }

  - type: callout
    heading: "Why we won't promise a date in summer"
    body: >
      Airlines change or cancel pet cargo at short notice when temperatures spike.
      We give you a realistic plan and keep you updated — but we never guarantee a
      summer delivery date, and we never give veterinary advice about heat fitness.
      That's a conversation for you and your vet.

