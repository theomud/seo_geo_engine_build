  - type: key_facts
    heading: "Quick answer"
    answer: "To bring a pet from the Philippines to the UAE you need an ISO microchip, a rabies vaccination given at least 21 days before travel, a rabies antibody (titre) test of ≥0.5 IU/ml valid for 365 days (the Philippines is a rabies high-risk origin), a Philippine government export/veterinary health certificate, and a MOCCAE import permit (AED 200, valid 90 days) arranged before travel. The minimum travel age is 15 weeks. Compliant pets are not quarantined in the UAE."
    stats:
      - { label: "MOCCAE permit", value: "AED 200, valid 90 days" }
      - { label: "Titre", value: "≥0.5 IU/ml, 365 days" }
      - { label: "Quarantine", value: "None if compliant" }
      - { label: "Release fee", value: "AED 500 dog / 250 cat" }
    verified: "June 2026"
