      - "The <strong>titre test defines the timeline</strong> — plan it first."
      - "<strong>No quarantine</strong> when fully compliant; the risk is documentation and timing."
      - "Summer (Jun–Sep) heat rules are an <strong>airline rule</strong> — plan routing around them."

  - type: faq
    id: faq
    heading: "Philippines → Dubai: your questions answered"
    items:
      - { q: "Does my pet need a rabies titre test from the Philippines?", a: "Yes, in almost all cases. The Philippines is a rabies high-risk origin, so the UAE requires a rabies antibody (titre) test of ≥0.5 IU/ml, valid for 365 days. We confirm your exact status before you commit, because it is the biggest timeline variable on this route." }
      - { q: "Will my pet be quarantined in the UAE?", a: "No — with a valid MOCCAE import permit, microchip, rabies vaccination and titre, pets are not quarantined on arrival. A release fee applies (AED 500 per dog, AED 250 per cat)." }
      - { q: "How much is the MOCCAE import permit?", a: "AED 200, and it is valid for 90 days. It must be arranged before travel and is the controlling document for the move." }
      - { q: "What is the minimum age my pet can travel?", a: "For a high-risk origin like the Philippines, the minimum travel age is 15 weeks, because the rabies vaccine and titre timeline cannot be completed any earlier." }
      - { q: "Can my pet travel in the cabin?", a: "Not on Emirates — pets travel as checked baggage (journey under 17 hours) or as cargo. Only guide dogs and falcons are carried in the cabin." }
      - { q: "How many pets can I bring?", a: "MOCCAE allows up to two pets per person per year. For more, we plan the move accordingly." }
      - { q: "Is summer a problem for flying my pet?", a: "It can be. From roughly June to September, airlines restrict live-animal carriage in extreme ground heat, and snub-nosed breeds face the tightest limits. We plan routing and timing around it." }
      - { q: "What documents do I need from the Philippine side?", a: "A government/veterinary export health certificate alongside the microchip and rabies records. We confirm the exact authority and current process per case before booking." }

