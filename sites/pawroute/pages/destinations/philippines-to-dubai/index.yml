  - type: story
    id: story
    heading: "What going wrong actually looks like"
    tag: "A common scenario"
    lead: "On this route, the trap is almost always the titre timing — not carelessness."
    problem: "A family books their flights early and gets the microchip and rabies vaccine done, feeling organised."
    mistake: "No one schedules the rabies titre test early enough for the result to be valid and inside the permit window."
    discovery: "At planning review the gap surfaces: the titre can't be completed in time for the booked date."
    result: "The flight is rebooked and the move slips by weeks while the titre and permit are aligned."
    lesson: "Confirm the titre and the 90-day permit window first, then book the flight around them — never the other way round."

