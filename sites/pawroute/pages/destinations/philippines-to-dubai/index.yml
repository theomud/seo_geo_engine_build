  - type: callout
    style: warn
    heading: "Plan the titre test first — it defines your timeline"
    body: >
      Because the Philippines is classed as a rabies high-risk origin, the UAE requires
      a rabies antibody (titre) test. The blood sample is taken after the rabies
      vaccination and the result is valid for 365 days — but arranging the test, the lab
      turnaround and aligning it with the 90-day permit window is what turns a smooth move
      into a slow one if left late. Confirm this step before you commit to a travel date.

  - type: prose
    id: uae-framework
    eyebrow: "The part we can anchor exactly"
    heading: "The UAE import side — the controlling rules"
    paragraphs:
      - "The UAE import requirements are set by MOCCAE (the Ministry of Climate Change and Environment) and are the same regardless of origin. They are the part of this route we can confirm precisely: a <strong>MOCCAE import permit</strong> (AED 200, valid 90 days, arranged before travel), a <strong>permanent ISO microchip</strong> that matches every document, a <strong>valid rabies vaccination</strong> given at least 21 days before travel, internal and external <strong>parasite treatment within 14 days</strong> of travel, and — for a high-risk origin like the Philippines — a <strong>rabies titre test (≥0.5 IU/ml, valid 365 days)</strong>."
      - "Two further MOCCAE rules matter for planning: the <strong>minimum travel age is 15 weeks</strong> for a high-risk origin, and there is a limit of <strong>two pets per person per year</strong>. On arrival, a release fee applies (AED 500 per dog, AED 250 per cat). When every requirement is met, <strong>there is no quarantine</strong> — your pet clears and comes home to you."

  - type: prose
    id: titre
    eyebrow: "The timeline-defining step"
    heading: "The rabies titre test, explained"
    paragraphs:
      - "A rabies titre (antibody) test proves the rabies vaccine produced enough immunity. The blood sample is drawn after vaccination and must return a result of at least <strong>0.5 IU/ml</strong>; that result is then valid for <strong>365 days</strong>. For pets from high-risk origins, the UAE relies on this test as the assurance that the rabies vaccination is genuinely protective."
      - "The reason it dominates the timeline is sequencing: microchip first, then the rabies vaccine, then — after the vaccine — the titre blood draw, then the lab turnaround, all of which has to land inside the 90-day validity of your MOCCAE permit. Get the order or the timing wrong and the move slips. This is the single step we confirm first on this route."

  - type: prose
    id: philippine-side
    eyebrow: "The origin side"
    heading: "The Philippine export side"
    paragraphs:
      - "Leaving the Philippines requires a government export/veterinary health certificate alongside the microchip and rabies records. The exact issuing authority and the current process should be <strong>confirmed with the relevant Philippine veterinary/quarantine authority before booking</strong> — we verify this per case rather than guess, because origin-side procedures change and a wrong assumption here is what causes delays."

  - type: prose
    id: flights
    eyebrow: "How your pet actually flies"
    heading: "Flights: cabin, baggage or cargo"
    paragraphs:
      - "On Emirates, pets are not carried in the cabin (only guide dogs and falcons are). They travel either as <strong>checked baggage</strong> when the total journey is under 17 hours, or as <strong>manifested cargo</strong> on longer or connecting itineraries. The right choice depends on routing and your pet's size and crate — we confirm it before booking so nothing is decided at the airport. The crate itself must meet <strong>IATA Live Animals Regulations</strong>: rigid, ventilated and correctly sized."

  - type: prose
    id: heat
    eyebrow: "A seasonal trap"
    heading: "Summer heat restrictions"
    paragraphs:
      - "From roughly June to September, airlines restrict live-animal carriage when ground temperatures exceed safe limits — this is an <strong>airline and IATA welfare rule, not a government one</strong>, which is why owners often discover it only after booking. Snub-nosed (brachycephalic) breeds face the tightest restrictions. On a hot-season move we plan around night flights and routing; it is a real constraint to design for, not a surprise to absorb."

