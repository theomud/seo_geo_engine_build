  - type: key_facts
    id: rule
    heading: "The accurate answer"
    answer: "Not every pet needs a rabies titre test to enter the UAE. MOCCAE requires the rabies antibody (titre) test only for pets coming from origins it classifies as high-risk for rabies — in which case the result must be at least 0.5 IU/ml and is valid for 365 days. From a low-risk origin, the titre test is usually not required. Because it depends on your origin's classification, we confirm your status against MOCCAE before you commit — when a titre is required, it's the single biggest variable in your timeline."
    stats:
      - { label: "When required", value: "High-risk origins" }
      - { label: "Result", value: "≥ 0.5 IU/ml" }
      - { label: "Valid", value: "365 days" }
      - { label: "Source", value: "MOCCAE" }
    verified: "June 2026"
    source_authority: "UAE MOCCAE"

  - type: callout
    style: warn
    heading: "Myth vs fact: 'every pet needs a rabies blood test'"
    body: >
      Many relocation guides imply a rabies titre test is always required for the UAE. It
      isn't — MOCCAE requires it only from high-risk-for-rabies origins. If your pet is
      coming from a low-risk origin, you usually don't need it at all, which removes the
      longest wait from the process. The deciding factor is your origin's classification, so
      we confirm it against the regulator before planning dates — rather than assuming a test
      you may not need (or skipping one you do).

  - type: prose
    id: detail
    eyebrow: "Why it matters so much"
    heading: "When the titre test applies — and why it's the timeline driver"
    paragraphs:
      - "The rabies titre (antibody) test proves a vaccination produced enough immunity. The UAE relies on it as extra assurance for pets from <strong>high-risk-for-rabies origins</strong>. From those origins the result must be <strong>≥0.5 IU/ml</strong> and is then valid for <strong>365 days</strong>. From a <strong>low-risk origin</strong>, it's generally not required."
      - "When it does apply, it dominates the schedule: the blood sample is drawn <em>after</em> vaccination, then there's a lab turnaround, and the whole sequence has to fit inside the 90-day import-permit window. That's why getting a clear answer on your origin's classification <strong>first</strong> matters more than any other single step — it's the difference between a few weeks and a few months."

  - type: checklist
    eyebrow: "If a titre is required"
    heading: "The titre rule (MOCCAE-verified)"
    body: "Confirmed against MOCCAE, June 2026. Applies to high-risk origins."
    items:
      - { title: "High-risk origins only", text: "Required only when your origin is classified high-risk for rabies — we confirm your status." }
      - { title: "Result ≥ 0.5 IU/ml", text: "The antibody level must meet or exceed this threshold." }
      - { title: "Valid 365 days", text: "Once passed, the result is valid for a year." }
      - { title: "After vaccination, before travel", text: "Drawn after the rabies vaccine, with lab turnaround timed inside the 90-day permit window." }

