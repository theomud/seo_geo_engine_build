  - type: hero
    eyebrow: "UAE import · Rabies titre test"
    heading: "Does my pet need a rabies titre test for the UAE?"
    subheading: >
      Often, no. Many sites imply every pet needs a rabies blood test to enter the UAE —
      but MOCCAE requires it only from high-risk-for-rabies origins. Whether it applies to
      you depends on where your pet is coming from, and it's the single biggest timeline
      variable when it does.
