      - { q: "What result does the titre test need?", a: "At least 0.5 IU/ml, and the result is then valid for 365 days — confirmed against MOCCAE." }
      - { q: "How do I know if my origin is high-risk?", a: "It depends on MOCCAE's current classification of your origin country. We confirm it against the regulator before you commit, because it decides whether a titre test (and its multi-week wait) applies to you." }
      - { q: "Why does the titre test take so long when it's required?", a: "The blood sample is drawn after vaccination, then there's a lab turnaround, and the result has to be valid and sit inside the 90-day permit window. That sequencing is why it's the biggest timeline variable on the routes where it applies." }

