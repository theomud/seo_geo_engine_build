  - type: callout
    heading: "The CDC Dog Import Form is now mandatory"
    body: >
      Since 1 August 2024, every dog entering the US must have a CDC Dog Import
      Form receipt, be at least 6 months old and be microchipped. Other details
      can vary by entry airport and state. We confirm the current requirements
      against the official CDC guidance for your specific route before booking.

  - type: checklist
    eyebrow: "The UAE side (always required)"
    heading: "What you'll need to leave the UAE"
    body: "Whatever your US destination, the export side is the same — and it's the part we control tightly."
    items:
      - { title: "ISO microchip first", text: "15-digit 11784/11785 chip, before any vaccination." }
      - { title: "Rabies vaccine", text: "At least 21 days before departure, with batch numbers documented." }
      - { title: "Export health certificate", text: "From a government vet, valid 30 days, exam within 10 days of departure." }
      - { title: "MOCCAE export clearance", text: "Online application plus airport cargo-terminal inspection." }
      - { title: "IATA crate", text: "Rigid, ventilated, sized to your pet by the IATA formula." }

