  - type: faq
    heading: "Dubai → USA: your questions"
    items:
      - { q: "Is there quarantine for the USA?", a: "Generally no quarantine for pets entering the US with correct documentation, but requirements depend on your pet and entry point. We confirm the current rules for your route." }
      - { q: "Why don't you just list the exact US requirements?", a: "Because they've changed in recent years and can vary by entry airport and state. We verify the live requirements with official sources for your specific case rather than risk printing something outdated." }
      - { q: "How far ahead should I book?", a: "Start 4–12 weeks out. Cargo space fills 30–60 days ahead, and the vaccine timing needs at least 21 days before departure." }
      - { q: "Can you guarantee the arrival date?", a: "No. Airlines change schedules. We give you a realistic timeline and keep you updated, but never guarantee a delivery date." }

