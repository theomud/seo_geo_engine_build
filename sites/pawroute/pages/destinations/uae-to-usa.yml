  - type: key_facts
    heading: "Quick answer"
    answer: "Moving a pet from Dubai to the USA takes about 4–12 weeks and costs roughly AED 13,800–22,000, with generally no quarantine. Since 1 August 2024 every dog entering the US needs a CDC Dog Import Form receipt, must be at least 6 months old, and must be microchipped — and exact rules can vary by entry airport and state, so we confirm them for your route."
