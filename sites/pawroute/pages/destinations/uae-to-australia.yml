  - type: story
    id: story
    heading: "Why starting early is everything"
    tag: "A common scenario"
    lead: "Australia isn't expensive because it's far — it's the timeline that catches people out."
    problem: "A family gets an Australian job offer and wants their dog over within six weeks."
    mistake: "They assume it works like the UK and book a vet appointment for the rabies titre test late."
    discovery: "Australia requires a 180-day wait after the titre test, plus a 10-day quarantine on arrival — there's no shortcut."
    result: "The dog can't travel with them; it follows months later, with extra boarding and a second set of flights."
    lesson: "For Australia, the calendar is the cost. Start the titre test the day the move is even possible — everything else waits on it."

  - type: faq
    heading: "Dubai → Australia: your questions"
    items:
      - { q: "Why does Australia take so long?", a: "Because of the rabies titre (RNATT) test and the 180-day waiting period that follows it, plus quarantine on arrival. If you're moving in 6–12 months, start now." }
      - { q: "How long is quarantine?", a: "A minimum of 10 days if the optional identity check is completed before the RNATT, otherwise a minimum of 30 days. It's a government requirement at an approved facility — every pet goes through it." }
      - { q: "What happens if a step is done out of order?", a: "On this route, an out-of-order step (for example vaccinating before microchipping) can reset the clock and cost you months. That's exactly what the service is for — getting the sequence right." }
      - { q: "Can you guarantee the arrival date?", a: "No — and be wary of anyone who does. Airlines and quarantine slots move. We give you a realistic timeline and keep you updated, but we never guarantee a delivery date." }

