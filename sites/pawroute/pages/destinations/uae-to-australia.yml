  - type: key_facts
    heading: "Quick answer"
    answer: "Moving a pet from Dubai to Australia is the world's strictest route and takes up to 6 months end to end, costing roughly AED 25,000–35,000+. It requires a rabies titre (RNATT) test, a 180-day wait after the test sample reaches the lab, an import permit, and quarantine on arrival (minimum 10 days with an identity check, otherwise 30)."
    stats:
      - { label: "Timeline", value: "Up to 6 months" }
      - { label: "Cost", value: "AED 25,000–35,000+" }
      - { label: "Wait after titre", value: "180 days" }
      - { label: "Quarantine", value: "10–30 days" }
    verified: "June 2026"
    source_authority: "Australia DAFF"

  - type: callout
    style: warn
    heading: "Why Australia takes months, not weeks"
    body: >
      Australia requires a rabies titer (RNAT) test at an approved lab, then a
      mandatory waiting period after you pass, and finally a 10-day government
      quarantine when your pet lands. Miss the sequence and the clock resets.
      This is why we map your exact dates before anything else.

  - type: checklist
    eyebrow: "What it takes"
    heading: "The Australia requirements"
    body: "These are the headline steps. We confirm the current detail with the Australian Department of Agriculture for your specific pet and dates before you commit to anything."
    items:
      - { title: "ISO microchip first", text: "15-digit 11784/11785 chip, implanted before any vaccination." }
      - { title: "Rabies vaccine + titer test", text: "A rabies neutralising antibody titer test at an approved laboratory." }
      - { title: "180-day waiting period", text: "Your pet can't be exported to Australia for 180 days after the RNATT sample reaches the lab — this is what makes the route take months. (It's a wait, not quarantine; your pet stays with you.)" }
      - { title: "Import permit", text: "Issued by the Australian Department of Agriculture (DAFF) before travel; assessment typically takes 10–20 business days." }
      - { title: "Quarantine on arrival", text: "Minimum 10 days at a government facility if the optional identity check is done beforehand — otherwise a minimum of 30 days. Non-negotiable." }

  - type: steps
    eyebrow: "The right order"
    heading: "How the Dubai → Australia move works"
    items:
      - { title: "Map the timeline (do this first)", text: "We work backwards from your move date to confirm whether it's achievable, and book the titer test window." }
      - { title: "Microchip + rabies vaccine", text: "Chip first, then vaccinate — order is everything on this route." }
      - { title: "Rabies titer test", text: "At an approved lab. The mandatory wait starts when it passes." }
      - { title: "Import permit + export paperwork", text: "Australian import permit plus the UAE MOCCAE export process." }
      - { title: "Book crate & flight", text: "IATA crate sized to your pet, on an airline and route approved for Australia." }
      - { title: "Fly, quarantine, reunite", text: "10 days in government quarantine on arrival, then home to you." }

