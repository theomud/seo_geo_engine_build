  - type: key_facts
    heading: "Quick answer"
    answer: "To bring a pet from Pakistan to the UAE you need an ISO microchip, a valid rabies vaccination given at least 21 days before travel, a government export/veterinary health certificate from Pakistan, and a MOCCAE import permit arranged before travel. Because Pakistan is a rabies high-risk origin, a rabies antibody (titre) test (≥0.5 IU/ml, valid 365 days) usually applies and the minimum travel age is 15 weeks. Compliant pets are not quarantined in the UAE."
