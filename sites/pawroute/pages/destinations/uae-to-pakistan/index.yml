  - type: prose
    id: what-decides
    eyebrow: "Where the experience is"
    heading: "What actually decides this route"
    paragraphs:
      - "On most routes out of Dubai, the hard part is the destination's rules. Pakistan is unusual in the other direction: the <strong>UAE export side is the predictable part</strong> — the MOCCAE export health certificate and clearance follow a known, repeatable process — and the part that moves your timeline is confirming <strong>Pakistan's current import requirements</strong> with the relevant Pakistani veterinary/quarantine authority."
      - "That is why, on this corridor, the order of work is reversed from a typical export: we confirm the arrival side <em>first</em>, then run the UAE export steps to meet it. The thing that goes wrong is almost never the Dubai paperwork — it's assuming the Pakistan side without confirming it."

  - type: prose
    id: pattern
    eyebrow: "Route intelligence (community-observed)"
    heading: "The recurring pattern on this corridor"
    paragraphs:
      - "From systematically reading the UAE expat-pet community and cross-checking it against the official Emirates and MOCCAE pages, a consistent picture emerges on this route. <strong>Most stress on Dubai → Pakistan is information stress, not logistics stress</strong> — owners hear conflicting advice and aren't sure which arrival requirements are current. The flight itself is routine: short, frequent, and handled as checked baggage when the journey is under 17 hours."
      - "The practical takeaways owners report: confirm the arrival requirements before committing to a date; keep the microchip and rabies records consistent across every document; and book the crate and cargo/baggage space early in peak periods. <em>These are observed patterns from community research and verified carrier rules — not guarantees about any individual case, which we always confirm per booking.</em>"

