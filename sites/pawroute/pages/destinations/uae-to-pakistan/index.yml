  - type: key_facts
    heading: "Quick answer"
    answer: "To send a pet from the UAE to Pakistan you complete the MOCCAE export process (export health certificate and clearance), keep the microchip and rabies records in order, and meet Pakistan's import requirements, which must be confirmed with the relevant Pakistani authority before booking. On Emirates the pet flies as checked baggage (journey under 17 hours) or as cargo — the cabin is for guide dogs and falcons only. The UAE export side is predictable; the arrival-side confirmation is the variable that decides the timeline."
