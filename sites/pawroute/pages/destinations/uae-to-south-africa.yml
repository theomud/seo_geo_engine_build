  - type: key_facts
    heading: "Quick answer"
    answer: "Moving a pet from Dubai to South Africa takes about 4–8 weeks and costs roughly AED 14,000–22,000. It needs a DALRRD veterinary import permit (arranged before travel), a microchip, a current rabies vaccination, and a health certificate completed within 10 days of the flight. Dogs also need blood tests certifying them free of certain diseases, and a 14-day quarantine can apply depending on the country of origin — we confirm your status first."
    stats:
      - { label: "Timeline", value: "4–8 weeks" }
      - { label: "Cost", value: "AED 14,000–22,000" }
      - { label: "Quarantine", value: "Origin-dependent*" }
      - { label: "Import permit", value: "DALRRD required" }
    verified: "June 2026"
    source_authority: "South Africa DALRRD"

  - type: checklist
    eyebrow: "What you'll need"
    heading: "Requirements for South Africa"
    body: "South Africa's import is handled through DALRRD (Department of Agriculture, Land Reform and Rural Development). We confirm the current detail before booking."
    items:
      - { title: "ISO microchip first", text: "15-digit chip, implanted before the rabies vaccine." }
      - { title: "Current rabies vaccination", text: "Documented and current, with batch numbers on the certificate." }
      - { title: "DALRRD import permit", text: "Required from the Department of Agriculture before travel." }
      - { title: "Health certificate", text: "Completed within 10 days of the flight, on the form that comes with the import permit." }
      - { title: "Dog disease blood tests", text: "Dogs must be certified free of certain diseases by blood test before import. We arrange these in the right window." }
      - { title: "MOCCAE export + IATA crate", text: "UAE export process and a crate sized to your pet." }

