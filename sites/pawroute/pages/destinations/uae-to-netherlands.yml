      - { q: "Is there quarantine for the Netherlands?", a: "No quarantine when your pet meets the EU rules and the paperwork is correct." }
      - { q: "Why is it cheaper than some EU routes?", a: "Amsterdam Schiphol is a major, pet-friendly cargo hub with frequent Dubai connections, which helps keep freight costs competitive." }
      - { q: "Will my pet need a rabies titre test?", a: "It depends on whether the UAE is an EU-listed country. Pets from non-listed countries need a rabies antibody (titre) test taken at least 30 days after vaccination and 90+ days before travel. We confirm your status against the official EU guidance before you commit, because it materially changes the timeline." }
      - { q: "How long does it take?", a: "Usually 4–8 weeks when no titre test is required — driven mainly by the 21-day minimum after the rabies vaccine and cargo availability. If a titre test is needed, allow several months." }
      - { q: "Can you guarantee the arrival date?", a: "No. Airlines change schedules. We give you a realistic timeline and keep you updated, but never guarantee a delivery date." }

