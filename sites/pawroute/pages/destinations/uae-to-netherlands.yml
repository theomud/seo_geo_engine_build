      - { title: "EU animal health certificate", text: "The third-country entry certificate (or an EU pet passport once established), completed correctly." }
      - { title: "Export health certificate + MOCCAE", text: "UAE export certificate (valid 30 days) and the MOCCAE export process." }
      - { title: "IATA crate", text: "Rigid, ventilated and sized to your pet." }

