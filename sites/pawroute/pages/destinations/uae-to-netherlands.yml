  - type: key_facts
    heading: "Quick answer"
    answer: "Moving a pet from Dubai to the Netherlands follows the EU import framework — no quarantine, and often the most affordable European route at roughly AED 10,000–16,000. You'll need a microchip, a rabies vaccine given 21+ days before travel and an EU animal health certificate. Important: pets entering the EU from a non-listed country can also need a rabies antibody (titre) test, taken at least 30 days after vaccination and 90+ days before travel — we confirm whether the UAE requires it, because it can add months to the timeline."
    stats:
      - { label: "Timeline", value: "4–8 weeks*" }
      - { label: "Cost", value: "AED 10,000–16,000" }
      - { label: "Quarantine", value: "None" }
      - { label: "Titre test", value: "May be required*" }
    verified: "June 2026"
    source_authority: "European Commission"

  - type: callout
    style: warn
    heading: "Check the rabies titre test early"
    body: >
      EU rules require a rabies antibody (titre) test for pets arriving from
      non-listed countries. Whether the UAE counts as listed decides if your pet
      needs it — and because the blood sample must be taken 90+ days before travel,
      it's the one thing that can turn a 4–8 week move into a multi-month one. We
      confirm your status with the official source before you commit.

