      - "The real requirements and timeline for your destination"
      - "Honest guidance on summer heat embargoes and deadlines"
    destinations: ["UK", "Australia", "USA", "Germany", "France", "Canada", "India", "Singapore", "South Africa", "Netherlands", "Into the UAE", "Somewhere else"]

  - type: cta
