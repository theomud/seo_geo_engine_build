      - "MOCCAE export process"
      - "IATA crate standards"
      - "No delivery-date guesswork"
    card:
      heading: "Typical cost from the UAE"
      rows:
        - { label: "Cat (standard route)", value: "AED 8,000–14,000" }
        - { label: "Dog (standard route)", value: "AED 13,800–18,000" }
        - { label: "Australia / Singapore", value: "AED 25,000–35,000+" }
      note: "Exact price depends on your pet's size and destination. We show the full breakdown — no “get quote to see price.”"

