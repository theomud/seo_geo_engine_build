  - type: article_header
    category: "Route guide · UK"
    category_url: "/blog/"
    h1: "Dubai to the UK: the tapeworm window that decides if your dog flies"
    standfirst: "One mistimed treatment is the most common reason a Dubai → UK pet move fails. The fix is free — if you know the rule."
    author: "the PawRoute relocation team"
    date: "9 June 2026"
    reading_time: 6
    reviewed: "reviewed by our IPATA-certified specialists"
    image: /assets/blog/cost-2026-hero.png
    image_alt: "A dog ready to travel from Dubai to the UK"

  - type: prose
    id: answer
    heading: "The short answer"
    paragraphs:
      - "To bring a dog into the UK from Dubai, a vet must treat it for tapeworm <strong>no less than 24 hours and no more than 120 hours (5 days) before arrival</strong> — not earlier, not later. Miss that window and your dog is refused entry or held. Cats are exempt."
      - "Get the microchip, rabies vaccine, APHA-approved health certificate and that tapeworm window right, and there's <strong>no quarantine</strong> — your dog clears and comes home the same day."

  - type: takeaways
    heading: "Key takeaways"
    items:
      - "Tapeworm treatment for dogs: <strong>24–120 hours before arrival</strong>. Cats don't need it."
      - "The UK health certificate must come from an <strong>APHA-approved</strong> vet — most Dubai vets aren't on that list."
      - "Order matters: <strong>ISO microchip first, then the rabies vaccine</strong> (≥21 days before travel)."
      - "Banned breeds can't enter: Pit Bull, <strong>XL Bully (since 1 Feb 2024)</strong>, Tosa, Dogo Argentino, Fila Brasileiro."
      - "Do it right and there is <strong>no quarantine</strong> — the risk is paperwork, not quarantine."

