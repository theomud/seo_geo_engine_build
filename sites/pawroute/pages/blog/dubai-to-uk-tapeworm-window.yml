  - type: prose
    id: window
    eyebrow: "The detail that matters most"
    heading: "The tapeworm window, exactly"
    paragraphs:
      - "The UK requires a vet to treat your dog with an approved tapeworm product (containing praziquantel) and record it, <strong>no less than 24 hours and no more than 5 days before you enter Great Britain</strong>. Treat too early and the record is invalid; too late and your dog can't board or is held at the border."
      - "Because the window is so tight, it has to be planned backwards from your exact flight — which is why the treatment is the last clinical step, not the first. Cats and ferrets are exempt; this is a dog-only rule."

  - type: prose
    id: vet
    eyebrow: "The other thing people miss"
    heading: "Why your normal Dubai vet may not work"
    paragraphs:
      - "The UK health certificate for a pet arriving from the UAE must be issued by an <strong>APHA-approved</strong> (official) veterinarian. Many Dubai clinics aren't on that list, and a certificate from the wrong vet is rejected at the UK border."
      - "Confirm your vet's approval <strong>before</strong> you book any appointment. This one check — vet approval plus the tapeworm timing — is what separates a smooth arrival from an expensive hold."

  - type: story
    id: story
    heading: "What going wrong actually looks like"
    tag: "A common scenario"
    lead: "The biggest cost on a Dubai → UK move is almost never the airline — it's one mistimed detail."
    problem: "An owner takes the cheapest quote for their Labrador, flying in three weeks."
    mistake: "The provider uses a vet who isn't APHA-approved and gives the tapeworm treatment a week early to 'be safe'."
    discovery: "At check-in the UK health certificate is rejected and the 24–120 hour window has lapsed — the dog can't board."
    result: "A rebooked flight, a fresh certificate and a few days of boarding add roughly AED 6,000 and over a week."
    lesson: "The cheapest quote cost the most. The APHA vet and the tapeworm window aren't details — they decide whether your dog flies."

  - type: faq
    id: faq
    heading: "Frequently asked questions"
    items:
      - { q: "Will my pet be quarantined when arriving in the UK?", a: "No — pets that arrive with correct paperwork are not quarantined. The risk is a documentation or timing error, not routine quarantine." }
      - { q: "Do I need a rabies blood test (titre) for the UK?", a: "No. The UAE is a 'listed' country for the UK, so there's no rabies titre test or three-month wait — just a valid rabies vaccination at least 21 days before travel." }
      - { q: "Does my cat need the tapeworm treatment?", a: "No. The tapeworm rule applies to dogs only." }
      - { q: "Can my XL Bully come to the UK?", a: "No. The XL Bully has been banned since 1 February 2024, alongside Pit Bull, Japanese Tosa, Dogo Argentino and Fila Brasileiro. We verify your breed before booking." }

