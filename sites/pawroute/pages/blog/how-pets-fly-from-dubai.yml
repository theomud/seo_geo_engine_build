  - type: compliance
    id: rules
    eyebrow: "Facts vs advice"
    heading: "What the airline requires — and how we'd use it"
    facts_label: "What Emirates' rules say (fact)"
    advice_label: "What we'd do (advice)"
    facts:
      - { text: "\"Animals are not permitted in the cabin of Emirates flights, with the exception of falcons between Dubai and certain destinations in Pakistan, and Guide Dogs for the visually impaired.\"", authority: "Emirates" }
      - { text: "Cats, dogs and birds can travel as checked baggage from Dubai if the total journey time is under 17 hours and the destination allows it.", authority: "Emirates" }
      - { text: "Animals must travel as cargo if the journey is over 17 hours, the Dubai transit is over 6 hours, or the itinerary ends in Dubai.", authority: "Emirates" }
      - { text: "Emirates Pets (SkyCargo) offers door-to-door transport, a dedicated Dubai Pet Lounge with 24/7 animal care, compliant with IATA Live Animals Regulations.", authority: "Emirates SkyCargo" }
    advice:
      - "For most relocations (UK, EU, USA, Australia) the journey length or rules push you to <strong>cargo</strong> — that's normal, and it's the most compliant, best-monitored option."
      - "If you're flying a <strong>short route and travelling with your pet</strong>, checked baggage can work — confirm your destination permits it first."
      - "Don't plan around <strong>cabin travel</strong> for a cat or dog from Dubai — it isn't available."
      - "<strong>Snub-nosed breeds:</strong> plan around the summer; airlines restrict them in the heat."

  - type: prose
    id: cargo
    eyebrow: "The main method"
    heading: "Emirates Pets (cargo), explained"
    paragraphs:
      - "Because most relocations exceed the 17-hour or transit limits, they travel as cargo — and on Emirates that's the <strong>Emirates Pets</strong> service. Pets are hosted in a dedicated Dubai Pet Lounge with 24/7 animal-care specialists, chauffeured to the aircraft in temperature-controlled vehicles, and carried in compliance with IATA's Live Animals Regulations."
      - "Cargo sounds clinical, but for a long-haul move it's the safest, most closely-monitored option — your pet is handled as a live animal, not luggage, with veterinary support on call."

  - type: prose
    id: charter
    eyebrow: "The honest answer on charter"
    heading: "What about a private charter?"
    paragraphs:
      - "Private charter (for example Emirates Executive) comes up when commercial capacity is tight or owners want their pet in the cabin with them. It can be a genuine fallback — but be careful: <strong>Emirates does not publish a pet-in-cabin policy for its private-jet service</strong>, so any 'pets fly in the cabin' claim must be confirmed in writing with the operator before you rely on it."
      - "We treat charter as a case-by-case option, not a default — and we never promise a cabin seat for a pet we haven't had confirmed by the operator."

  - type: story
    id: story
    heading: "What going wrong actually looks like"
    tag: "A common scenario"
    lead: "The usual mix-up is planning around the cabin, or assuming baggage works on a long haul."
    problem: "An owner books a Dubai → Australia trip expecting their dog in checked baggage on their flight."
    mistake: "The journey is well over 17 hours, so checked baggage isn't allowed — and they've planned the whole move around it."
    discovery: "The dog has to travel as cargo (Emirates Pets), which is a different booking and timeline."
    result: "A re-plan around the cargo schedule — avoidable by checking the method first."
    lesson: "Pick the method before the flight: short hop with you = baggage; long haul = cargo. Cabin isn't on the table for cats and dogs."

  - type: faq
    id: faq
    heading: "Frequently asked questions"
    items:
      - { q: "Can my dog or cat fly in the cabin from Dubai?", a: "Not on Emirates. Animals aren't permitted in the cabin except falcons (Dubai–Pakistan) and guide dogs for the visually impaired. Cats and dogs travel in the hold — as checked baggage or as cargo." }
      - { q: "What's the difference between checked baggage and cargo?", a: "Both ride in a pressurised, temperature-controlled hold. Checked baggage is on your flight (allowed if the journey is under 17 hours and the destination permits). Cargo (Emirates Pets) is a separate live-animal shipment, required for longer journeys, long transits, or trips ending in Dubai." }
      - { q: "Is cargo safe for my pet?", a: "On Emirates, cargo pets are hosted in a dedicated Pet Lounge with 24/7 animal-care specialists, moved in temperature-controlled vehicles, and carried under IATA Live Animals Regulations — it's closely monitored, not 'luggage'." }
      - { q: "Can I charter a private jet so my pet flies in the cabin?", a: "Possibly, but Emirates doesn't publish a pet-in-cabin policy for its private-jet service, so it must be confirmed in writing with the operator. We never promise a cabin seat we haven't had confirmed." }

