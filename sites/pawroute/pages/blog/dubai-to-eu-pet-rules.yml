    h1: "Dubai to the EU: the health certificate and the titre-test question"
    standfirst: "Bringing a pet into the EU from Dubai needs a microchip, a rabies vaccination and an EU animal health certificate — and one variable decides your timeline: whether a rabies titre test is required."
    author: "the PawRoute relocation team"
    date: "9 June 2026"
