  - type: prose
    id: answer
    heading: "The short answer"
    paragraphs:
      - "To bring a cat or dog into the EU from Dubai you need an <strong>ISO microchip</strong>, a <strong>rabies vaccination given at least 21 days before travel</strong>, and an <strong>EU animal health certificate</strong> issued close to your travel date by an authorised vet."
      - "The one thing that changes the timeline is the <strong>rabies titre (antibody) test</strong>: the EU requires it for pets arriving from <em>non-listed</em> third countries, with a waiting period after the blood draw. Whether it applies to you depends on the UAE's current EU listing status — so confirm that first, because it can add months."

  - type: takeaways
    heading: "Key takeaways"
    items:
      - "Core requirements: <strong>ISO microchip</strong>, <strong>rabies vaccine ≥21 days</strong> before travel, <strong>EU animal health certificate</strong>."
      - "The EU certificate is issued close to travel and is <strong>time-limited</strong> for entry and onward movement."
      - "A <strong>rabies titre test</strong> applies for non-listed origins and adds a waiting period — confirm whether it applies to the UAE."
      - "No quarantine when fully compliant; the risk is paperwork and timing."
      - "Typical cost Dubai → EU: roughly <strong>AED 10,000–18,000</strong>, about 4–8 weeks (longer if a titre test is required)."

