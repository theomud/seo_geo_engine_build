  - type: prose
    id: framework
    eyebrow: "What's the same everywhere in the EU"
    heading: "The EU framework"
    paragraphs:
      - "The EU runs a single framework for pet entry, so Germany, France and the Netherlands share the same backbone: microchip, valid rabies vaccination, and an EU animal health certificate completed by an authorised vet shortly before travel."
      - "Because that certificate has a tight validity window for entry, it's one of the last steps — planned backwards from your flight, not done early."

  - type: prose
    id: titre
    eyebrow: "The part that changes the timeline"
    heading: "The titre-test variable"
    paragraphs:
      - "For pets coming from countries the EU classifies as <em>non-listed</em>, a rabies antibody (titre) test is required. The blood sample must be taken <strong>at least 30 days after the rabies vaccination</strong>, and <strong>at least 90 days (three months) before</strong> the EU animal health certificate is issued — so for a non-listed origin it adds roughly three months. For <em>listed</em> origins the test isn't needed at all."
      - "The EU animal health certificate itself is <strong>valid for 10 days to enter the EU</strong>, then up to <strong>6 months for onward travel</strong> within the EU. The one fact that decides which path you're on — listed or non-listed — is the UAE's classification in Annex I to the EU's pet-movement regulation, so confirm that with the official source below before you commit to dates."

  - type: story
    id: story
    heading: "What going wrong actually looks like"
    tag: "A common scenario"
    lead: "On the EU route, the trap is the certificate's tight validity window."
    problem: "An owner gets the EU animal health certificate done weeks ahead, to feel organised."
    mistake: "By the travel date the certificate's entry-validity window has passed."
    discovery: "The certificate has to be issued close to travel — too early is as bad as missing it."
    result: "A repeat vet visit and a re-issued certificate, plus a rushed re-book around the new dates."
    lesson: "On the EU route, sequence beats speed: confirm the titre question first, then time the certificate to the flight — last, not first."

  - type: faq
    id: faq
    heading: "Frequently asked questions"
    items:
      - { q: "Do I need a rabies titre test for the EU from Dubai?", a: "It depends on the UAE's EU listing. For non-listed third countries the EU requires a titre test — sample taken at least 30 days after vaccination and at least 90 days before the health certificate, adding about three months. For listed origins it isn't needed. Confirm the UAE's current status (Annex I) before booking — it's the biggest timeline variable." }
      - { q: "Is the process the same for Germany, France and the Netherlands?", a: "Largely yes — they share the EU framework (microchip, rabies, EU animal health certificate). Local entry-point details can differ, so we confirm per country." }
      - { q: "Will my pet be quarantined in the EU?", a: "No quarantine when you're fully compliant. The real risk is a documentation or certificate-timing error." }
      - { q: "How much does Dubai → EU cost?", a: "Typically AED 10,000–18,000 depending on your pet's size and the country, and longer/dearer if a titre test is required." }

