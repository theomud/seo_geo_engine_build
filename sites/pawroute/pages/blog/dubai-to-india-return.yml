    image: /assets/blog/cost-2026-hero.png
    image_alt: "A pet ready to travel from Dubai to India"

  - type: prose
    id: answer
    heading: "The short answer"
    paragraphs:
      - "To bring a pet into India from Dubai you need an <strong>ISO microchip</strong>, a valid <strong>rabies vaccination</strong>, the standard UAE export documents, and — the pivotal piece — an <strong>import permit / NOC</strong> from India's Animal Quarantine and Certification Service (AQCS)."
      - "It's one of the cheaper routes (typically <strong>AED 8,000–14,000</strong>, around 3–5 weeks), but the paperwork is precise: returning residents must document their stay abroad, and the rules on how many pets you can import are specific. Confirm the current AQCS requirements before you travel."

  - type: takeaways
    heading: "Key takeaways"
    items:
      - "The pivotal document is the <strong>AQCS import permit / NOC</strong> — without it, your pet can be refused or held."
      - "Core records: <strong>ISO microchip</strong> and a valid <strong>rabies vaccination</strong>."
      - "<strong>Returning residents</strong> typically need to evidence their period abroad — keep documentation ready."
      - "India applies <strong>limits on the number of pets</strong> per passenger — confirm the current rule."
      - "Typical cost Dubai → India: roughly <strong>AED 8,000–14,000</strong>, about 3–5 weeks."

