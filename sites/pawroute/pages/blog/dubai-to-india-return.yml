  - type: prose
    id: docs
    eyebrow: "Where the route is won or lost"
    heading: "The documentation that matters"
    paragraphs:
      - "India's process hinges on the import permit / NOC from the AQCS. Around it sit the microchip, the rabies record, and — for returning residents — evidence of your time abroad, which can affect what you're allowed to bring."
      - "Because the specifics (permit timing, pet limits, any titre requirement) are set by the authorities and can change, confirm the current AQCS requirements before committing to a date. Getting the NOC right is the whole game on this route."

  - type: story
    id: story
    heading: "What going wrong actually looks like"
    tag: "A common scenario"
    lead: "On the India route, the trap is treating the NOC as a formality."
    problem: "A family returning to India books flights and gets the vet records done."
    mistake: "They leave the AQCS import permit / NOC to the last week and don't have their residence documentation ready."
    discovery: "The NOC has its own process and lead time, and the paperwork on time abroad is needed to support it."
    result: "Travel slips while the permit is sorted, with the pet boarded in Dubai in the meantime."
    lesson: "Start the AQCS NOC early and gather your residence documents up front — the permit, not the flight, sets the timeline."

  - type: faq
    id: faq
    heading: "Frequently asked questions"
    items:
      - { q: "What's the most important document for India?", a: "The import permit / NOC from the Animal Quarantine and Certification Service (AQCS). It has its own lead time, so start it early." }
      - { q: "How many pets can I bring to India?", a: "India applies limits on the number of pets a passenger can import, and rules differ for returning residents. Confirm the current rule with AQCS before booking." }
      - { q: "Will my pet be quarantined in India?", a: "With the NOC and correct documentation in order, pets are typically not quarantined — but confirm current requirements, as they can change." }
      - { q: "How much does Dubai → India cost?", a: "Typically AED 8,000–14,000 — one of the cheaper routes — over about 3–5 weeks, depending on your pet's size and the airline." }

