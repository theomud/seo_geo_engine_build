  - type: flow
    id: timeline
    heading: "The six-month timeline"
    body: "Each step gates the next — which is why starting early is the whole game."
    steps:
      - "ISO microchip + rabies vaccination"
      - "Rabies titre (RNAT) blood test"
      - "180-day waiting period begins"
      - "Apply for the Australian import permit"
      - "Book the flight + government quarantine"
      - "Arrival + minimum quarantine, then home"

  - type: prose
    id: cost
    eyebrow: "Where the money goes"
    heading: "Why Australia costs more"
    paragraphs:
      - "The higher cost isn't the airfare — it's the extra steps. The titre test, the import permit, and the mandatory quarantine stay all add fees that other routes simply don't have, which is why Australia runs AED 25,000–35,000+ versus AED 12,000–18,000 for the UK."
      - "Because the 180-day clock can't be compressed, an attempt to rush usually just adds boarding costs while you wait. Time spent planning early is the cheapest part of the whole move."

  - type: story
    id: story
    heading: "Why starting early is everything"
    tag: "A common scenario"
    lead: "Australia's cost is the calendar — and that catches people who treat it like the UK."
    problem: "A family gets an Australian job offer and wants their dog over within six weeks."
    mistake: "They book the rabies titre test late, assuming the rest can be rushed."
    discovery: "The 180-day wait after the titre test can't be shortened, and quarantine must be booked on top."
    result: "The dog can't travel with them; it follows months later, with extra boarding and a second set of flights."
    lesson: "For Australia, start the titre test the day the move is even possible. Everything else waits on that one clock."

  - type: faq
    id: faq
    heading: "Frequently asked questions"
    items:
      - { q: "Why is Australia so much more expensive?", a: "The rabies titre test, the import permit and the mandatory quarantine all add cost and months of time. It's the rules, not the distance, that make it AED 25,000–35,000+." }
      - { q: "How long does the whole process take?", a: "Plan for around six months, driven by the 180-day waiting period after the rabies titre test plus quarantine on arrival." }
      - { q: "Can I avoid the quarantine?", a: "No. Quarantine on arrival is a mandatory part of Australia's biosecurity system for cats and dogs." }
      - { q: "What should I do first?", a: "Get the ISO microchip and rabies vaccination sorted, then book the titre test as early as possible — it starts the 180-day clock that everything else depends on." }

