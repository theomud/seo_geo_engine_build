    h1: "Can my pet be taken at the airport? The honest answer"
    standfirst: >
      It's the fear nobody says out loud: you do everything right, and at the airport
      your dog is held, refused, or taken — and you can't fix it. Here's what actually
      happens, why it happens, and the one thing that prevents almost every case.
    author: "the PawRoute relocation team"
    date: "9 June 2026"
    reading_time: 7
    reviewed: "reviewed by our IPATA-process specialists"

  - type: key_facts
    heading: "The honest answer"
    answer: >
      A pet is almost never simply "taken and never returned." When a pet is held,
      refused boarding, or sent to quarantine at an airport, it is nearly always caused
      by one preventable paperwork problem — a missing rabies titre test, a microchip and
      rabies vaccine done in the wrong order, or a health certificate that has expired or
      doesn't match the destination's rules. Every one of those is fixable before you fly.
      The fear is real; the cause is controllable.
    stats:
      - { label: "Most common cause", value: "Document error" }
      - { label: "When it's caught", value: "At check-in / arrival" }
      - { label: "Preventable?", value: "Almost always" }
      - { label: "The fix", value: "Sequence + verify" }
    verified: "June 2026"
    source_authority: "the European Commission, IATA and MOCCAE"

  - type: callout
    style: warn
    heading: "If this is the fear keeping you up at night — read this first"
    body: >
      We hear it in almost every first message: "every website says something different,
      and I'm terrified of getting it wrong." That fear is the right instinct — getting the
      paperwork wrong is exactly what causes a pet to be held. But it is not random and it
      is not bad luck. It comes from a short list of known, fixable mistakes. Once you can
      see the list, the fear turns into a checklist.

  - type: prose
    id: why
    eyebrow: "What's really happening"
    heading: "Why a pet actually gets held at an airport"
    paragraphs:
      - "Almost every airport problem is one of two things: your pet is <strong>refused at departure</strong> (Dubai-side — the airline or export check won't accept them) or <strong>held on arrival</strong> (the destination authority won't clear them). Both feel like the same nightmare. Both come from the same short list of causes — and the list is the good news, because every item on it is something you control <em>before</em> the flight."
      - "Here is what actually triggers it, in the order it matters."

  - type: checklist
    eyebrow: "The controllable causes"
    heading: "The short list — and how each one is prevented"
    body: "Every cause below is documented in official rules and is fixable before travel. This is the whole list that matters for the routes out of Dubai."
    items:
      - { title: "Microchip and rabies in the wrong order", text: "The ISO microchip must be implanted BEFORE the rabies vaccine, or strict destinations treat the vaccine as invalid. Prevention: chip first, always — sequence is checked at the start, not the end." }
      - { title: "Missing or mistimed rabies titre (blood) test", text: "Strict destinations (the EU from a non-listed origin, Australia, South Africa) require a rabies antibody test with a fixed waiting period after the blood draw. Skip it or mistime it and the pet can't enter. Prevention: confirm whether your route needs it on day one — it's the biggest timeline variable there is." }
      - { title: "A health certificate that's expired, early, or wrong", text: "Health and export certificates have tight validity windows — issued too early is as disqualifying as missing. Prevention: the certificate is timed backwards from your flight and matched to the destination's exact wording, last — not first." }
      - { title: "Breed or crate refused by the airline", text: "Snub-nosed breeds face seasonal embargoes; some breeds are banned by specific airlines; an undersized crate is refused at the counter. Prevention: airline and breed rules are confirmed before booking, not at check-in." }
      - { title: "A missing destination permit or import document", text: "Many countries need an import permit or specific entry document arranged in advance. Prevention: the destination's document list is built for your exact route before the vet work even starts." }

  - type: prose
    id: what-happens
    eyebrow: "The part people imagine worst"
    heading: "So what actually happens if something is wrong?"
    paragraphs:
      - "The outcome people fear most — a pet taken and never returned — is the rare worst case of a compliance failure that is never corrected. The far more common outcomes of a paperwork problem are a <strong>refused boarding</strong> (you don't fly that day), a <strong>return to the origin country</strong>, or a period of <strong>quarantine</strong> at the destination. Every one of those is expensive, stressful and avoidable — and every one is caused by something that was knowable before the flight."
      - "That's the reframe that matters: the airport is not where the outcome is decided. It's where it's <em>revealed</em>. The decision was made weeks earlier, in the sequence and the paperwork. Get those right against the official source, and the airport is just a door your pet walks through."

  - type: story
    id: story
    heading: "What going wrong actually looks like"
    tag: "A common scenario"
    lead: "The trap is almost never carelessness. It's doing things in good faith, in the wrong order."
    problem: "An organised owner gets every document done early to feel on top of it, and books the flight."
    mistake: "No one confirmed whether the route needed a rabies titre test — and the destination required one, taken months before travel."
    discovery: "At the export check the gap surfaces: the titre window can't be met, so the pet can't be cleared for that flight."
    result: "The flight is rebooked, the timeline slips by weeks or months, and a calm move becomes a frightening scramble."
    lesson: "Nothing here was bad luck. Confirm the titre question and the certificate timing against the official source on day one, and this entire scenario never starts."

  - type: takeaways
    heading: "What to hold onto"
    items:
      - "A pet being <strong>taken and never returned is the rare worst case</strong>, not the normal result of a mistake — and the normal results are still preventable."
      - "Almost every airport problem traces to <strong>one of five known, fixable causes</strong> — not bad luck."
      - "The outcome is <strong>decided weeks before the airport</strong>, in the sequence and the paperwork."
      - "The single biggest variable on strict routes is the <strong>rabies titre test</strong> — confirm it first."
      - "When every step is verified against the <strong>official source</strong>, there is nothing left at the airport to go wrong."

  - type: faq
    id: faq
    heading: "The questions people are afraid to ask"
    items:
      - { q: "Can my dog actually be taken away at the airport?", a: "Outright permanent confiscation is the rare worst case of a compliance failure that is never corrected — it is not the normal outcome of a paperwork mistake. The routine consequences of a document problem are a refused boarding, a return to the origin country, or quarantine. All are preventable before you fly, which is the entire point of getting the sequence and certificates right against the official source." }
      - { q: "What actually happens if one of my documents is wrong?", a: "It depends where it's caught. At departure in Dubai, the airline or export check can refuse the pet for that flight. On arrival, the destination authority can hold the pet, require quarantine, or send it back. None of these is random — each maps to a specific, knowable rule that can be checked in advance." }
      - { q: "What's the single most common reason pets get held?", a: "A documentation or timing error — most often a missing or mistimed rabies titre test, a microchip and rabies vaccine done in the wrong order, or a health certificate issued outside its valid window. These are the first things we lock down because they cause the most problems." }
      - { q: "Every website says something different. How do I know what's actually true for my pet?", a: "Because rules are route-specific and change, general advice is genuinely unreliable. The only safe answer is your destination's official source for your exact pet and date. We confirm the current requirement against the official authority (the European Commission, the destination government, IATA and MOCCAE) before anyone commits to a date." }
      - { q: "How do you make sure this never happens to my pet?", a: "We work the move backwards from the rules: confirm the destination's exact requirements and the titre question on day one, get the microchip and vaccines in the correct sequence, time every certificate to the flight, and confirm the airline and crate before booking. By the time your pet reaches the airport, every check has already been passed on paper." }

