  - type: hero
    eyebrow: "Straight answers"
    heading: "Pet relocation, answered"
    subheading: >
      Moving a pet from the UAE takes about 4–8 weeks and costs roughly AED 8,000–35,000.
      Below are straight answers to the questions owners actually ask — cost, timing,
      quarantine and the rules that trip people up. No fluff.
    ctas:
      - { label: "Get my quote", url: "#quote", style: "btn-gold" }
      - { label: "See destinations", url: "/destinations/", style: "btn-ghost" }

  - type: faq
    eyebrow: "Cost & timing"
    heading: "Cost and timing"
    items:
      - { q: "How much does it cost to relocate my pet from the UAE?", a: "Standard routes run roughly AED 13,800–26,000. Harder routes like Australia and Singapore can be AED 25,000–35,000+. The exact figure depends on your pet's size, the destination and the airline — and we show you the full breakdown." }
      - { q: "What makes the price go up or down?", a: "Three things: your pet's size (airlines charge by crate volume), the destination (permits, titer tests and quarantine add cost), and the airline and season. A small cat to India costs a fraction of a large dog to Australia." }
      - { q: "How long does the whole process take?", a: "Standard routes are usually 4–8 weeks. EU routes and India can be quicker. Australia and Singapore take months because of titer tests and waiting periods. Start as soon as your move date is set." }
      - { q: "Can you guarantee when my pet will arrive?", a: "No — and be cautious of anyone who does. Airlines change schedules and slots move. We give you a realistic timeline and keep you updated the whole way, but we never guarantee a delivery date." }

  - type: faq
    variant: section--surface
    eyebrow: "Rules & paperwork"
    heading: "Rules and paperwork"
    items:
      - { q: "What's the very first step?", a: "An ISO 11784/11785 microchip — implanted before any rabies vaccination. If you vaccinate before microchipping, the vaccine is invalid and you start over." }
      - { q: "How does the rabies vaccine timing work?", a: "For a first vaccination, it must be given at least 21 days before departure, with batch numbers documented on the certificate. Some countries also require a rabies titer (antibody) test after that." }
      - { q: "Will my pet have to go into quarantine?", a: "It depends on the destination. Most standard routes (UK, EU, USA, Canada, India, South Africa) need no quarantine when paperwork is correct. Australia (10 days) and Singapore (30 days) require it by law." }
      - { q: "What is the MOCCAE export process?", a: "MOCCAE is the UAE's Ministry of Climate Change and Environment. Exporting a pet means an online application, an airport cargo-terminal inspection, and a government-vet sign-off. The export health certificate is valid for 30 days." }
      - { q: "Are any breeds banned?", a: "Yes. Pit Bull and several Mastiff-type breeds can't be exported from the UAE, and some are banned at destinations (for example the UK). We verify your breed before booking so there are no nasty surprises." }
      - { q: "How many pets can I move?", a: "For import into the UAE the limit is 2 pets per person per year. For outbound moves it depends on the destination and airline — tell us how many and we'll confirm." }

  - type: faq
    eyebrow: "Safety & travel"
    heading: "Safety and travel"
    items:
      - { q: "Can I fly my pet in summer?", a: "It's the biggest seasonal catch. From roughly May to September, airlines restrict or refuse pet cargo in extreme UAE heat, which can delay departure by weeks. If you're moving in summer, plan early and we'll route around the embargo." }
      - { q: "Is cargo safe for my pet?", a: "A healthy pet travels safely in a modern, pressurised, temperature-controlled cargo hold. For pets over about 10 years, a fit-to-fly check is sensible. We never give veterinary medical advice — that's a conversation for you and your vet." }
      - { q: "Can my pet travel in the cabin with me instead?", a: "Cabin options are very limited for relocation and depend on the airline and route. For most international moves from the UAE, pets travel as manifested cargo in a proper crate. We'll tell you honestly what's possible for your route." }
      - { q: "Do I need pet insurance?", a: "It's not required but recommended — airline liability is limited (around AED 1,000). Our Premium package includes transit insurance." }

  - type: faq
    variant: section--surface
    eyebrow: "Working with PawRoute"
    heading: "Working with us"
    items:
      - { q: "What does PawRoute actually handle?", a: "The whole sequence: vets, paperwork, MOCCAE export, the IATA crate, the airline booking and customs clearance — coordinated so each step happens in the right order, on time." }
      - { q: "How do I get started?", a: "Send us your destination, your pet's details and your rough timing on WhatsApp or the quote form. We'll reply with a transparent price range and the exact first step." }
      - { q: "Do I have to pay to ask questions?", a: "No. Quotes, route requirements and a chat with our assistant are free. You only pay when you decide to go ahead." }

